<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Demonstração de um organizador de tarefas com filtros e armazenamento local.">
<title>Organizador de tarefas — Projeto demonstrativo</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f5f9;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:900px;margin:0 auto;padding:56px 24px}
header{margin-bottom:28px}.eyebrow{color:#5368c4;font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.04em;margin:.35rem 0}.sub{color:#657087;line-height:1.6;margin:0}
.card{background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:24px;box-shadow:0 12px 36px #1827440a}
form{display:flex;gap:10px;margin:24px 0 18px}input{min-width:0;flex:1;border:1px solid #d7dce7;border-radius:10px;padding:13px 14px;font:inherit}button{border:0;border-radius:10px;padding:12px 17px;background:#4257bd;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#33469f}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filters button{background:#edf0f7;color:#46516a;padding:8px 12px;font-size:.9rem}.filters button[aria-pressed=true]{background:#e2e7ff;color:#3449ac}
ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid #e8ebf1;border-radius:11px}.task input{flex:none;width:18px;height:18px;accent-color:#4257bd}.task span{flex:1;overflow-wrap:anywhere}.task.done span{text-decoration:line-through;color:#8992a3}.remove{background:transparent;color:#9b4350;padding:5px 8px}.remove:hover{background:#fff0f2;color:#8d2534}
footer{display:flex;justify-content:space-between;color:#748096;font-size:.9rem;margin-top:16px}.empty{padding:28px;text-align:center;color:#748096}
@media(max-width:560px){.wrap{padding:32px 16px}form{flex-direction:column}.card{padding:18px}}
</style>
</head>
<body>
<main class="wrap">
<header><div class="eyebrow">Projeto demonstrativo · HTML, CSS e JavaScript</div><h1>Organizador de tarefas</h1><p class="sub">Uma lista simples para planejar o dia. As tarefas ficam salvas neste navegador.</p></header>
<section class="card" aria-label="Lista de tarefas">
<form id="form"><input id="input" maxlength="120" placeholder="Ex.: revisar o README do projeto" aria-label="Nova tarefa" required><button type="submit">Adicionar tarefa</button></form>
<nav class="filters" aria-label="Filtrar tarefas"><button type="button" data-filter="all" aria-pressed="true">Todas</button><button type="button" data-filter="open" aria-pressed="false">Pendentes</button><button type="button" data-filter="done" aria-pressed="false">Concluídas</button></nav>
<ul id="list"></ul><div id="empty" class="empty" hidden>Nenhuma tarefa neste filtro.</div>
<footer><span id="count">0 pendentes</span><span>Dados armazenados localmente</span></footer>
</section>
</main>
<script>
const key="organizador-tarefas-demo-v1";let tasks=JSON.parse(localStorage.getItem(key)||"[]"),filter="all";
const list=document.querySelector("#list"),empty=document.querySelector("#empty"),count=document.querySelector("#count");
function render(){list.replaceChildren();const shown=tasks.filter(t=>filter==="all"||(filter==="open"&&!t.done)||(filter==="done"&&t.done));empty.hidden=shown.length>0;
for(const task of shown){const li=document.createElement("li");li.className="task"+(task.done?" done":"");const check=document.createElement("input");check.type="checkbox";check.checked=task.done;check.setAttribute("aria-label","Marcar tarefa como concluída");check.addEventListener("change",()=>{task.done=check.checked;save()});const label=document.createElement("span");label.textContent=task.text;const remove=document.createElement("button");remove.type="button";remove.className="remove";remove.textContent="Remover";remove.setAttribute("aria-label","Remover "+task.text);remove.addEventListener("click",()=>{tasks=tasks.filter(t=>t.id!==task.id);save()});li.append(check,label,remove);list.append(li)}
const n=tasks.filter(t=>!t.done).length;count.textContent=n===1?"1 tarefa pendente":n+" tarefas pendentes"}
function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();const input=document.querySelector("#input");const text=input.value.trim();if(!text)return;tasks.unshift({id:crypto.randomUUID(),text,done:false});input.value="";save();input.focus()});
document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{filter=button.dataset.filter;document.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));render()}));render();
</script>
</body>
</html>
